name: Build and publish unsigned prerelease

on:
  push:
    branches: [main]
    paths:
      - xbox_proxy/version.h
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haptics-prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install lupa==2.8
      - name: Compile and run native, Lua and packaging tests
        shell: pwsh
        run: |
          $env:HAPTICS_PYTHON = (Get-Command python).Source
          & .\xbox_proxy\build.cmd test
          if ($LASTEXITCODE -ne 0) { throw 'Build or tests failed' }
      - name: Package matching DLL, Lua ZIP and sources
        shell: pwsh
        run: |
          $archive = & powershell.exe -NoProfile -File .\xbox_proxy\tools\artifacts.ps1 -Action Package -Mode test
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          $archive = @($archive)[-1].Trim()
          if (!(Test-Path -LiteralPath $archive)) { throw 'Missing archive' }
          "HAPTICS_ARCHIVE=$archive" >> $env:GITHUB_ENV
      - name: Publish complete unsigned prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $definition = Get-Content .\xbox_proxy\version.h -Raw
          $match = [regex]::Match($definition, 'HAPTICS_VERSION_STRING\s+"(\d+\.\d+\.\d+\.\d+)"')
          if (!$match.Success) { throw 'Invalid version definition' }
          $version = $match.Groups[1].Value
          $tag = "v$version"
          gh release view $tag --json url 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite it" }
          gh release create $tag $env:HAPTICS_ARCHIVE "$($env:HAPTICS_ARCHIVE).sha256" --draft --prerelease --target $env:GITHUB_SHA --title "Xbox Haptic Feedback Controller $version" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation or upload failed' }
          gh release edit $tag --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed; draft preserved' }
